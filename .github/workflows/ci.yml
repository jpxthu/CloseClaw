name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Test target to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - lib
          - integration
          - doc

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-nextest

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Check env var prohibition
        run: |
          set -e
          # 禁止 set_var / remove_var（load_env_file 除外），详见 docs/developer/STANDARDS.md §7
          matches=$(grep -rn '\bset_var\b\|\bremove_var\b' src/ --include='*.rs' | grep -v 'load_env_file' || true)
          if [ -n "$matches" ]; then
            echo "ERROR: 检测到 std::env::set_var / remove_var 调用："
            echo "$matches"
            echo "环境变量修改在多线程和并行测试中会导致数据竞争，全代码库禁止使用。"
            echo "正确做法与例外说明见 docs/developer/STANDARDS.md §7（并行安全）"
            exit 1
          fi
          echo "env var check passed"

      - name: Strict warning check
        run: cargo check

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

      - name: Run tests (nextest)
        run: cargo nextest run --workspace --lib --bins --tests --no-fail-fast

      - name: Run doc tests
        run: cargo test --workspace --doc --no-fail-fast
