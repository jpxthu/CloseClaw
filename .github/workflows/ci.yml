name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 版本固定策略（细则见 CONTRIBUTING「CI 版本固定」）：
#   - 所有 action 一律 pin 到 commit SHA，行尾注释版本
#   - CI 工具版本在本段集中声明，禁止 latest
#   - 守卫：scripts/periodic-checks.sh --pin-audit
env:
  CARGO_TERM_COLOR: always
  CARGO_NEXTEST_VERSION: "0.9.146"
  CARGO_MACHETE_VERSION: "0.9.2"

jobs:
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Check env var prohibition
        run: |
          set -e
          # 禁止 set_var / remove_var（load_env_file 除外）；判定与文案单一来源，与 pre-commit hook 共享
          # 细则见 docs/developer/STANDARDS.md §7
          bash scripts/check-env-var.sh all

      - name: Check test audit
        run: |
          set -e
          # 测试合规静态扫描：禁止硬编码路径 / 手动目录管理 / 环境变量泄漏；与 pre-commit hook 共享
          # 细则见 docs/developer/STANDARDS.md §8
          bash scripts/test-audit.sh

      - name: Check test naming guard
        run: |
          set -e
          # 测试函数 test_ 前缀静态守卫（细则见 docs/developer/STANDARDS.md §3）：
          # baseline=现状，仅新增违规 FAIL
          python3 scripts/test-naming-guard/test_naming_guard.py

      - name: Strict warning check
        run: cargo check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-machete
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-machete@${{ env.CARGO_MACHETE_VERSION }}

      - name: Run dep guard
        run: |
          # 解耦治理守卫：依赖方向 / 禁二次出口 / common 准入 / 死依赖 / rust-version 声明完整性（baseline=现状，仅对新增越界报警）
          bash scripts/periodic-checks.sh --dep-guard

      - name: Run tests (nextest)
        run: cargo nextest run --workspace --lib --bins --tests --no-fail-fast

      - name: Run doc tests
        run: cargo test --workspace --doc --no-fail-fast

  feature-tests:
    name: Feature-gated tests (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target-feature
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Cache cargo build (feature)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target-feature
          key: ${{ runner.os }}-cargo-feature-${{ hashFiles('**/Cargo.lock') }}

      - name: Run feature-gated tests
        run: |
          set -e
          # fake-llm / full-tests 门控用例不在默认跑批内，必须显式打开（细则见 docs/developer/STANDARDS.md §5）
          # 跨 crate 打开 feature 必须用 crate/feature 语法，workspace 根下裸 --features 无效
          cargo nextest run --workspace --lib --bins --tests --no-fail-fast \
            --features closeclaw-llm/fake-llm,closeclaw-gateway/full-tests

  msrv:
    name: MSRV check (1.85)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target-msrv
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85 --profile minimal

      - name: Cache cargo build (msrv)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target-msrv
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: MSRV check
        run: cargo +1.85 check --workspace --all-targets --locked
