name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Test target to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - lib
          - integration
          - doc

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Check env var prohibition
        run: |
          set -e
          # 禁止 set_var / remove_var（load_env_file 除外）
          # 详见 CONTRIBUTING.md「环境变量禁令」
          #
          # 白名单：已无存量违规文件（历史条目随 tests/ 目录重整清理完毕）
          whitelist=()
          matches=$(grep -rn '\bset_var\b\|\bremove_var\b' src/ --include='*.rs' | grep -v 'load_env_file' || true)
          if [ -n "$matches" ]; then
            violations=""
            while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1)
              is_whitelisted=false
              for wl in "${whitelist[@]}"; do
                if [ "$file" = "$wl" ]; then
                  is_whitelisted=true
                  break
                fi
              done
              if [ "$is_whitelisted" = false ]; then
                violations="$violations\n$line"
              fi
            done <<< "$matches"
            if [ -n "$violations" ]; then
              echo "ERROR: 检测到 std::env::set_var / remove_var 调用："
              echo -e "$violations"
              echo ""
              echo "环境变量修改在多线程和并行测试中会导致数据竞争，全代码库禁止使用。"
              echo "唯一例外：daemon/mod.rs 中的 load_env_file()（启动阶段加载 .env 文件）。"
              echo ""
              echo "正确做法："
              echo "  - 配置值通过参数/config struct 传递，不写入全局 env"
              echo "  - 测试中用依赖注入或临时文件路径代替 set_var"
              echo "  - 只读取环境变量请用 std::env::var（安全）"
              echo ""
              echo "详见 CONTRIBUTING.md「环境变量禁令」"
              exit 1
            fi
          fi
          echo "env var check passed"

      - name: Check function body limit
        run: |
          set -e
          # CONTRIBUTING.md「硬性限制」：函数体行数 ≤ 100
          # 对 crates/ 和 src/ 下所有 .rs 文件检查
          violations=$(find crates/ src/ -name '*.rs' -print0 | xargs -0 awk '
          /^\s*(pub\s+)?(async\s+)?(unsafe\s+)?(extern\s+"[^"]*"\s+)?fn\s+[a-zA-Z_]/ {
              match($0, /fn\s+([a-zA-Z_][a-zA-Z0-9_]*)/, m)
              fname = m[1]
              start = FNR
              depth = 0
              in_body = 0
              for (i = 1; i <= length($0); i++) {
                  c = substr($0, i, 1)
                  if (c == "{") { depth++ }
                  if (c == "}") { depth-- }
              }
              if (depth > 0) { in_body = 1 }
              next
          }
          in_body {
              for (i = 1; i <= length($0); i++) {
                  c = substr($0, i, 1)
                  if (c == "{") { depth++ }
                  if (c == "}") { depth-- }
              }
              if (depth <= 0) {
                  body_lines = FNR - start
                  if (body_lines > 100) {
                      printf "%s:%d %s %d lines\n", FILENAME, start, fname, body_lines
                  }
                  in_body = 0
              }
          }
          ' 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "ERROR: 以下函数体超过 100 行限制："
            echo "$violations"
            echo ""
            echo "详见 CONTRIBUTING.md「硬性限制」"
            exit 1
          fi
          echo "function body limit check passed"

      - name: Strict warning check
        run: cargo check

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

      - name: Run unit and binary tests
        run: cargo test --workspace --lib --bins --no-fail-fast

      - name: Run integration tests
        run: cargo test --workspace --tests --no-fail-fast

      - name: Run doc tests
        run: cargo test --workspace --doc --no-fail-fast
