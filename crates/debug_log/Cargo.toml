[package]
name = "closeclaw-debug-log"
version = "0.1.0"
edition = "2021"
description = "Debug log framework for CloseClaw — structured JSONL logging with redaction"
license = "MIT"

[dependencies]
closeclaw-common = { path = "../common" }
tokio = { version = "=1.35.0", features = ["fs", "sync", "io-util", "rt", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "=0.1.43"
uuid = { version = "1.6", features = ["v4"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "=1.35.0", features = ["rt", "rt-multi-thread", "macros", "fs", "sync"] }
