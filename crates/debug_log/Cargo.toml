[package]
name = "closeclaw-debug-log"
version = "0.1.0"
edition.workspace = true
description = "Debug log framework for CloseClaw — structured JSONL logging with redaction"
license.workspace = true

[dependencies]
tokio = { version = "=1.35.0", features = ["fs", "sync", "io-util", "rt", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
uuid = { version = "1.6", features = ["v4"] }
thiserror = "2.0"
async-trait = "0.1"

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "=1.35.0", features = ["rt", "rt-multi-thread", "macros", "fs", "sync"] }
