[package]
name = "closeclaw-slash"
version = "0.1.0"
edition.workspace = true
description = "Slash command system for CloseClaw"
license.workspace = true

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }
closeclaw-debug-log = { path = "../debug_log" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true

# Async runtime
tokio = { version = "=1.35.0", features = ["full"] }

# Logging
tracing.workspace = true

# Error handling
thiserror = "2.0"

# Async trait
async-trait = "0.1"

[dev-dependencies]
tempfile.workspace = true
filetime = "0.2"
closeclaw-gateway = { path = "../gateway" }
closeclaw-session = { path = "../session" }
closeclaw-skills = { path = "../skills" }
closeclaw-test-support = { path = "../test_support" }
closeclaw-workflow = { path = "../workflow" }
serde_yaml = "0.9"
