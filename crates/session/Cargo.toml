[package]
name = "closeclaw-session"
version = "0.1.0"
edition.workspace = true
description = "Session management for CloseClaw"
license.workspace = true
rust-version.workspace = true

[dependencies]
# Internal crates — only the allowed edge table (docs/design/STANDARDS.md)
closeclaw-common = { path = "../common" }
closeclaw-debug-log = { path = "../debug_log" }
dirs.workspace = true
serde_yaml.workspace = true

# Async runtime
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# Date/time
chrono.workspace = true

# UUID
uuid.workspace = true

# Hashing
sha2.workspace = true
hex.workspace = true

# Random (for plan identifier generation)
rand.workspace = true

# System
libc.workspace = true

# Redis client
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }

# SQLite
rusqlite.workspace = true

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
filetime.workspace = true
tracing-subscriber.workspace = true
# Enables `#[tokio::test(start_paused = true)]` (paused-clock unit tests).
tokio = { workspace = true, features = ["test-util"] }
# Test-only workspace deps (outside the allowed edge table, which constrains
# regular [dependencies] only): tests provide a real-engine WorkflowPort
# wrapper and config fixtures against the real types.
closeclaw-config = { path = "../config" }
closeclaw-test-support = { path = "../test_support" }
closeclaw-workflow = { path = "../workflow" }
