[package]
name = "closeclaw-common"
version = "0.1.0"
edition.workspace = true
description = "Shared types and utilities for CloseClaw"
license.workspace = true

[dependencies]
async-trait = "0.1"
anyhow = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
thiserror = "2.0"
tokio = { version = "=1.35.0", features = ["sync", "process"] }

# Concurrent data structures (FileMutexMap)
dashmap = "5"

# Hashing (used by session_key)
sha2 = "0.10"

# UUID (used by trace_id)
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "=1.35.0", features = ["rt", "rt-multi-thread", "macros"] }
