[package]
name = "closeclaw-common"
version = "0.1.0"
edition.workspace = true
description = "Shared types and utilities for CloseClaw"
license.workspace = true

[dependencies]
async-trait = "0.1"
anyhow.workspace = true
futures = "0.3"
chrono.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
thiserror = "2.0"
tokio.workspace = true

# Concurrent data structures (FileMutexMap)
dashmap = "5"

# Hashing (used by session_key)
sha2 = "0.10"

# UUID (used by trace_id)
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
