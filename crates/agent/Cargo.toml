[package]
name = "closeclaw-agent"
version = "0.1.0"
edition.workspace = true
description = "Agent configuration, registry, and spawn control"
license.workspace = true

[lib]
name = "closeclaw_agent"
path = "src/lib.rs"

[dependencies]
closeclaw-common = { path = "../common" }
async-trait = "0.1"
dashmap = "5"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
serde_json.workspace = true
