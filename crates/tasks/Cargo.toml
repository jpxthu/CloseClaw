[package]
name = "closeclaw-tasks"
version = "0.1.0"
edition.workspace = true
description = "Background task management for CloseClaw"
license.workspace = true

[dependencies]
tokio = { version = "=1.35.0", features = ["full"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
async-trait = "0.1"
tracing.workspace = true
serde_json.workspace = true
closeclaw-common = { path = "../common" }
closeclaw-debug-log = { path = "../debug_log" }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
# Enables `#[tokio::test(start_paused = true)]` (paused-clock unit tests).
tokio = { version = "=1.35.0", features = ["test-util"] }
