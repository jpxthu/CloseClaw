[package]
name = "closeclaw-tools"
version = "0.1.0"
edition.workspace = true
description = "Tools system for CloseClaw"
license.workspace = true

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }
closeclaw-debug-log = { path = "../debug_log" }

# Async runtime
tokio = { version = "=1.35.0", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Concurrent data structures (FileMutexMap)
dashmap = "5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"

# Error handling
thiserror = "2.0"

# Async trait
async-trait = "0.1"

# Logging
tracing.workspace = true

# Glob pattern matching
glob = "0.3"

# Tree-sitter for Bash AST parsing
tree-sitter = "0.24"
tree-sitter-bash = "0.23"

# Regex
regex = "1.10"
regex-lite = "0.1"

# Unicode normalization for fuzzy matching
unicode-normalization = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Terminal size detection
terminal_size = "0.4"

# Async stream
async-stream = "0.3.6"

# Image processing for Read tool
image = "0.25"
base64 = "0.22"

[dev-dependencies]
closeclaw-agent = { path = "../agent" }
closeclaw-config = { path = "../config" }
closeclaw-gateway = { path = "../gateway" }
closeclaw-permission = { path = "../permission" }
closeclaw-session = { path = "../session" }
closeclaw-skills = { path = "../skills" }
closeclaw-tasks = { path = "../tasks" }
closeclaw-test-support = { path = "../test_support" }
tempfile.workspace = true
serial_test.workspace = true
