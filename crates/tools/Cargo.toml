[package]
name = "closeclaw-tools"
version = "0.1.0"
edition.workspace = true
description = "Tools system for CloseClaw"
license.workspace = true

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }
closeclaw-debug-log = { path = "../debug_log" }

# Async runtime
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

# Concurrent data structures (FileMutexMap)
dashmap = "5"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Error handling
thiserror.workspace = true

# Async trait
async-trait.workspace = true

# Logging
tracing.workspace = true

# Glob pattern matching
glob = "0.3"

# Tree-sitter for Bash AST parsing
tree-sitter = "0.24"
tree-sitter-bash = "0.23"

# Regex
regex.workspace = true
regex-lite = "0.1"

# Unicode normalization for fuzzy matching
unicode-normalization = "0.1"

# Date/time
chrono.workspace = true

# UUID
uuid.workspace = true

# Terminal size detection
terminal_size = "0.4"

# Async stream
async-stream = "0.3.6"

# Image processing for Read tool
image = "0.25"
base64 = "0.22"

[dev-dependencies]
closeclaw-agent = { path = "../agent" }
closeclaw-config = { path = "../config" }
closeclaw-gateway = { path = "../gateway" }
closeclaw-permission = { path = "../permission" }
closeclaw-session = { path = "../session" }
closeclaw-skills = { path = "../skills" }
closeclaw-tasks = { path = "../tasks" }
closeclaw-test-support = { path = "../test_support" }
tempfile.workspace = true
serial_test.workspace = true
