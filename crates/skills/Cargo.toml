[package]
name = "closeclaw-skills"
version = "0.1.0"
edition.workspace = true
description = "Skills system for CloseClaw"
license.workspace = true

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }

# Async runtime
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Error handling
thiserror.workspace = true

# Async trait
async-trait.workspace = true

# Logging
tracing.workspace = true

# Glob pattern matching (for conditional skill activation)
glob = "0.3"


[dev-dependencies]
closeclaw-permission = { path = "../permission" }
closeclaw-workflow = { path = "../workflow" }
tempfile.workspace = true
serial_test.workspace = true
filetime = "0.2"
