[package]
name = "closeclaw-execution"
version = "0.1.0"
edition.workspace = true
description = "Plan execution engine: scheduling, retry, and sub-agent orchestration"
license.workspace = true

[dev-dependencies]
tokio = { version = "=1.35.0", features = ["rt", "macros", "time"] }
tempfile.workspace = true

[dependencies]
closeclaw-common = { path = "../common" }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
thiserror = "2.0"
async-trait = "0.1"
tracing.workspace = true
tokio = { version = "=1.35.0", features = ["process", "time"] }
