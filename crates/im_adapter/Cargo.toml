[package]
name = "closeclaw-im-adapter"
version = "0.1.0"
edition.workspace = true
description = "IM adapter system for CloseClaw"
license.workspace = true
rust-version.workspace = true

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }
closeclaw-debug-log = { path = "../debug_log" }

# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Async trait
async-trait.workspace = true

# Logging
tracing.workspace = true

# Regex (for normalized URL processing)
regex.workspace = true

# HTTP client
reqwest = { workspace = true, features = ["multipart"] }
bytes = "1"

# Date/time
chrono.workspace = true

# UUID
uuid.workspace = true

# Plugin auto-discovery
inventory = "0.3"

# Home directory expansion
dirs.workspace = true

[dev-dependencies]
closeclaw-debug-log = { path = "../debug_log", features = ["test-util"] }
closeclaw-test-support = { path = "../test_support" }
tempfile.workspace = true
serial_test.workspace = true

# HTTP server (for adapter tests)
axum.workspace = true
