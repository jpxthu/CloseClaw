[package]
name = "closeclaw-im-adapter"
version = "0.1.0"
edition.workspace = true
description = "IM adapter system for CloseClaw"
license.workspace = true

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }
closeclaw-debug-log = { path = "../debug_log" }

# Async runtime
tokio.workspace = true
tokio-util = "0.7"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"

# Error handling
thiserror = "2.0"

# Async trait
async-trait = "0.1"

# Logging
tracing.workspace = true

# Regex (for normalized URL processing)
regex.workspace = true

# HTTP client
reqwest = { workspace = true, features = ["multipart"] }
bytes = "1"

# Hashing (for signature validation)
sha2 = "0.10"

# Date/time
chrono.workspace = true

# UUID
uuid.workspace = true

# URL encoding
url = "2"

# Plugin auto-discovery
inventory = "0.3"

# Home directory expansion

dirs = "5"

# HTTP server (for adapter tests)
axum = "0.7"

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true

# Manifest parsing for dependency boundary tests
toml = "1"
