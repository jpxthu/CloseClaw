[package]
name = "closeclaw-fake-llm"
version = "0.1.0"
edition.workspace = true
description = "Fake LLM Server: independent HTTP test server for OpenAI & Anthropic protocols"
license.workspace = true

[dependencies]
# Async runtime (pinned to match workspace)
tokio = { version = "=1.35.0", features = ["full"] }

# HTTP server
axum = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true

# Logging (pinned to match workspace)
tracing.workspace = true
tracing-subscriber = { version = "=0.3.17", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Stream trait for SSE delivery
futures-core = "0.3"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
