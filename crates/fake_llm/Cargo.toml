[package]
name = "closeclaw-fake-llm"
version = "0.1.0"
edition.workspace = true
description = "Fake LLM Server: independent HTTP test server for OpenAI & Anthropic protocols"
license.workspace = true

[dependencies]
# Async runtime (pinned to match workspace)
tokio.workspace = true

# HTTP server
axum = "0.7"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging (pinned to match workspace)
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Stream trait for SSE delivery
futures-core = "0.3"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
futures.workspace = true
