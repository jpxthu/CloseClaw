[package]
name = "closeclaw-llm"
version = "0.1.0"
edition.workspace = true
description = "LLM provider abstraction and chat types for CloseClaw"
license.workspace = true

[features]
fake-llm = []
test-helpers = []

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }
closeclaw-debug-log = { path = "../debug_log" }

# Async runtime
tokio.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true

# Error handling
thiserror.workspace = true

# HTTP client
reqwest.workspace = true

# Async trait
async-trait.workspace = true

# Date/time
chrono.workspace = true

# Glob pattern matching
glob = "0.3"

# Hashing (for model cache)
sha2.workspace = true
hex = "0.4"

# Async stream
async-stream = "0.3.6"

[dev-dependencies]
anyhow.workspace = true
mockito = "1.2"
tempfile.workspace = true
toml = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("server", "chat-legacy"))'] }
