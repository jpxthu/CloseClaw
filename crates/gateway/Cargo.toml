[package]
name = "closeclaw-gateway"
version = "0.1.0"
edition.workspace = true
description = "Gateway - IM protocol adapters, message routing, authentication"
license.workspace = true
rust-version.workspace = true

[features]
full-tests = []

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }
closeclaw-config = { path = "../config" }
closeclaw-debug-log = { path = "../debug_log" }
closeclaw-llm = { path = "../llm" }
closeclaw-permission = { path = "../permission" }
closeclaw-session = { path = "../session" }

# Async runtime
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true

# Error handling
thiserror.workspace = true

# Async trait
async-trait.workspace = true

# System
libc.workspace = true
dirs.workspace = true

# Date/time
chrono.workspace = true

# UUID
uuid.workspace = true

# Hashing
sha2.workspace = true
base64.workspace = true

# Shell lexing for command parsing
shlex = "1.3"

[dev-dependencies]
closeclaw-debug-log = { path = "../debug_log", features = ["test-util"] }
closeclaw-im-adapter = { path = "../im_adapter" }
closeclaw-llm = { path = "../llm", features = ["test-helpers"] }
# dev-dependencies are not constrained by the allowed-edge table: tests keep
# assembling the real processor chain.
closeclaw-processor-chain = { path = "../processor_chain" }
closeclaw-test-support = { path = "../test_support" }
# Same exemption: tests keep building workflow fixtures (run/definition).
closeclaw-workflow = { path = "../workflow" }
reqwest.workspace = true
tempfile.workspace = true
serial_test.workspace = true
serde_yaml.workspace = true
tracing-subscriber.workspace = true
# Enables `#[tokio::test(start_paused = true)]` (paused-clock unit tests).
tokio = { workspace = true, features = ["test-util"] }
