[package]
name = "closeclaw-gateway"
version = "0.1.0"
edition.workspace = true
description = "Gateway - IM protocol adapters, message routing, authentication"
license.workspace = true

[features]
full-tests = []

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }
closeclaw-config = { path = "../config" }
closeclaw-debug-log = { path = "../debug_log" }
closeclaw-llm = { path = "../llm" }
closeclaw-permission = { path = "../permission" }
closeclaw-session = { path = "../session" }

# Async runtime
tokio.workspace = true
tokio-util = "0.7"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true

# Logging
tracing.workspace = true

# Error handling
thiserror = "2.0"

# Async trait
async-trait = "0.1"

# System
libc = "0.2"
dirs = "5"

# Date/time
chrono.workspace = true

# UUID
uuid.workspace = true

# Hashing
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Shell lexing for command parsing
shlex = "1.3"

[dev-dependencies]
closeclaw-im-adapter = { path = "../im_adapter" }
closeclaw-llm = { path = "../llm", features = ["test-helpers"] }
# dev-dependencies are not constrained by the allowed-edge table: tests keep
# assembling the real processor chain.
closeclaw-processor-chain = { path = "../processor_chain" }
closeclaw-test-support = { path = "../test_support" }
# Same exemption: tests keep building workflow fixtures (run/definition).
closeclaw-workflow = { path = "../workflow" }
reqwest.workspace = true
tempfile.workspace = true
serial_test.workspace = true
serde_yaml = "0.9"
tracing-subscriber.workspace = true
# Enables `#[tokio::test(start_paused = true)]` (paused-clock unit tests).
tokio = { workspace = true, features = ["test-util"] }
