[package]
name = "closeclaw-memory"
version = "0.1.0"
edition.workspace = true
description = "Long-term memory for CloseClaw agents"
license.workspace = true

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }

# Async runtime
tokio = { version = "=1.35.0", features = ["full"] }

# Async trait
async-trait = "0.1"

# Error handling
thiserror = "2.0"

# Serialization
serde_json.workspace = true

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing.workspace = true

# SQLite for active searcher (bundled to avoid system SQLite dependency)
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true

# Manifest parsing for dependency boundary tests
toml = "1"
