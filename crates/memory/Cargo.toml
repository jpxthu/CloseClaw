[package]
name = "closeclaw-memory"
version = "0.1.0"
edition.workspace = true
description = "Long-term memory for CloseClaw agents"
license.workspace = true

[dependencies]
# Internal crates
closeclaw-common = { path = "../common" }

# Async runtime
tokio.workspace = true

# Async trait
async-trait.workspace = true

# Error handling
thiserror.workspace = true

# Serialization
serde_json.workspace = true

# Date/time
chrono.workspace = true

# Logging
tracing.workspace = true

# SQLite for active searcher (bundled to avoid system SQLite dependency)
rusqlite.workspace = true

[dev-dependencies]
closeclaw-test-support = { path = "../test_support" }
tempfile.workspace = true
serial_test.workspace = true
