[dev-dependencies]
closeclaw-im-adapter = { path = "../im_adapter" }
closeclaw-test-support = { path = "../test_support" }
tempfile.workspace = true
serde_yaml.workspace = true
tracing-subscriber.workspace = true
tracing-test.workspace = true
