[package]
name = "closeclaw-cli"
version = "0.1.0"
edition.workspace = true
description = "CLI interface for CloseClaw"
license.workspace = true

[lib]
name = "closeclaw_cli"
path = "src/lib.rs"

[dependencies]
closeclaw-agent = { path = "../agent" }
closeclaw-common = { path = "../common" }
closeclaw-config = { path = "../config" }
closeclaw-gateway = { path = "../gateway" }
closeclaw-llm = { path = "../llm" }
closeclaw-permission = { path = "../permission" }
closeclaw-platform = { path = "../platform" }
clap = { version = "4.4", features = ["derive"] }
dialoguer = "0.11"
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
dirs = "5"
unicode-width = "0.2"

[dev-dependencies]
closeclaw-processor-chain = { path = "../processor_chain" }
tempfile.workspace = true
serial_test.workspace = true
